name: Release

on:
  workflow_dispatch:  # 允许手动触发
  push:
    tags:
      - 'v*'  # 当推送v开头的tag时触发

permissions:
  contents: write
  pull-requests: write
  packages: write
  id-token: write
  attestations: write

env:
  PYTHONUTF8: 1
  FLET_CLI_NO_RICH_OUTPUT: 1

jobs:
  # 构建Docker镜像
  build-docker-image:
    uses: ./.github/workflows/image.yml


  # 构建macOS Arm应用
  build-windows-app:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flet

      - name: Build macOS app with Flet
        run: |
          cp -r AgentUtils App/AgentUtils
          cp -r Business App/Business
          cp pyproject.toml ./App
          flet build windows ./App --output=build/windows -v

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-app
          path: build/windows
          retention-days: 7
          overwrite: true

  # 构建macOS Arm应用
  build-macos-arm-app:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install FFmpeg via Homebrew
        run: |
          brew update
          brew install ffmpeg

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flet

      - name: Install CocoaPods
        run: |
          sudo gem install cocoapods -v 1.16.0

      - name: Build macOS app with Flet
        run: |
          cp -r AgentUtils App/AgentUtils
          cp -r Business App/Business
          cp pyproject.toml ./App
          flet build macos ./App --output=build/macos -v

      - name: Upload macOS Arm app artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm-app
          path: build/macos/**/*.app
          retention-days: 7
          overwrite: true

  # 构建Linux应用
  build-linux-app:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flet

      - name: Patch for linux build
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build libgtk-3-dev

      - name: Build Linux app with Flet
        run: |
          cp -r AgentUtils App/AgentUtils
          cp -r Business App/Business
          cp pyproject.toml ./App
          flet build linux ./App --output=build/linux -v

      - name: Upload Linux app artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-app
          path: build/linux
          retention-days: 7
          overwrite: true

  # 构建macOS x86_64应用
  build-macos-x86-app:
    runs-on: macos-13
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install FFmpeg via Homebrew
        run: |
          brew update
          brew install ffmpeg

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flet

      - name: Install CocoaPods
        run: |
          sudo gem install cocoapods -v 1.16.0

      - name: Build macOS app with Flet
        run: |
          cp -r AgentUtils App/AgentUtils
          cp -r Business App/Business
          cp pyproject.toml ./App
          flet build macos ./App --output=build/macos -v --arch x86_64

      - name: Upload macOS x86 app artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-x86-app
          path: build/macos/**/*.app
          retention-days: 7
          overwrite: true

  # 创建Release并上传所有构建产物
  create-release:
    needs: [build-macos-arm-app, build-linux-app, build-macos-x86-app]
    runs-on: ubuntu-latest
    steps:
      - name: Download macOS Arm artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-arm-app
          path: artifacts/macos-arm-app

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-app
          path: artifacts/linux-app

      - name: Download macOS x86 artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-x86-app
          path: artifacts/macos-x86-app

      - name: List downloaded artifacts (for debugging)
        run: ls -la artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        id: create_release
        with:
          tag_name: latest
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create zip archives
        run: |
          cd artifacts/macos-arm-app && zip -r ../macos-arm-app.zip . && cd ../..
          cd artifacts/linux-app && zip -r ../linux-app.zip . && cd ../..
          cd artifacts/macos-x86-app && zip -r ../macos-x86-app.zip . && cd ../..

      - name: Upload macOS Arm Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: artifacts/macos-arm-app.zip
          asset_name: macos-arm-app.zip
          asset_content_type: application/zip

      - name: Upload Linux Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: artifacts/linux-app.zip
          asset_name: linux-app.zip
          asset_content_type: application/zip

      - name: Upload macOS x86 Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: artifacts/macos-x86-app.zip
          asset_name: macos-x86-app.zip
          asset_content_type: application/zip