name: Build Liunx Flet App

on:
  pull_request:
  push:
    branches:
      - main  # 根据您的默认分支名称调整

env:
  # Ensures Python uses UTF-8 encoding by default
  PYTHONUTF8: 1
  # Disables rich text formatting in Flet CLI output
  FLET_CLI_NO_RICH_OUTPUT: 1

jobs:
  build-linux-app:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flet

    - name: Patch for linux build
      run: |
        sudo apt-get update -y
        sudo apt-get install -y ninja-build libgtk-3-dev

    - name: Build Linux app with Flet
      run: |
        cp -r AgentUtils App/AgentUtils
        cp -r Business App/Business
        cp pyproject.toml ./App
        flet build linux ./App --output=build/macos -v

    - name: Upload Linux app artifact (on push only)
      uses: actions/upload-artifact@v4
      with:
        name: Linux-Flet-App
        path: build/linux/**/*.app
        retention-days: 1