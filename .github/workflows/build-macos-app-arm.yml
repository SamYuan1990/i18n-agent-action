name: Build macOS Flet App Arm

on:
  pull_request:
  push:
    branches:
      - main  # 根据您的默认分支名称调整

env:
  # Ensures Python uses UTF-8 encoding by default
  PYTHONUTF8: 1
  # Disables rich text formatting in Flet CLI output
  FLET_CLI_NO_RICH_OUTPUT: 1

jobs:
  build-macos-app:
    runs-on: macos-latest  # 使用最新的 macOS 运行器

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install FFmpeg via Homebrew
      run: |
        brew update
        brew install ffmpeg
    #- name: Install Rosetta 2
    #  run: sudo softwareupdate --install-rosetta --agree-to-license

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flet

    - name: Install CocoaPods
      run: |
        sudo gem install cocoapods -v 1.16.0

    - name: Build macOS app with Flet
      run: |
        cp -r AgentUtils App/AgentUtils
        cp -r Business App/Business
        cp pyproject.toml ./App
        flet build macos ./App --output=build/macos -v

    - name: Upload macOS app artifact (on push only)
      uses: actions/upload-artifact@v4
      with:
        name: macOS-Flet-App-Arm
        path: build/macos
        retention-days: 1