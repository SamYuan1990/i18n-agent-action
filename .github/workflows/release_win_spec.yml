name: Release_win_spec

on:
  workflow_dispatch:  # 允许手动触发
  push:
    tags:
      - 'v*'  # 当推送v开头的tag时触发

permissions:
  contents: write
  pull-requests: write
  packages: write
  id-token: write
  attestations: write

env:
  PYTHONUTF8: 1
  FLET_CLI_NO_RICH_OUTPUT: 1

jobs:
  # 构建macOS Arm应用
  build-windows-app:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flet

      - name: Build macOS app with Flet
        run: |
          cp -r AgentUtils App/AgentUtils
          cp -r Business App/Business
          cp pyproject.toml ./App
          flet build windows ./App --output=build/windows -v

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-app
          path: build/windows
          retention-days: 7
          overwrite: true
