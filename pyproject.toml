[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["Business", "AgentUtils", "App"]  # 明确指定包

[project]
name = "i18n-agent-action"
version = "0.1.0"
requires-python = ">=3.12,<4.0"  # 更新这一行
description = "An Agent running in GHA for free us from i18n works in documentation repos"
authors = [
    { name = "SamYuan1990", email = "yy19902439@126.com" },
]
dependencies = [
    "openai (>=1.100.2,<2.0.0)",
    "python-defer (>=0.2.1,<0.3.0)",
    "filelock (>=3.19.1,<4.0.0)",
    "pyyaml (>=6.0.2,<7.0.0)",
    "pyttsx3 (>=2.99,<3.0)",
    "cryptography (>=43.0.1)",
    "asyncio (>=4.0.0,<5.0.0)",
    "requests (>=2.32.5,<3.0.0)",
    "flet (==0.70.0.dev5623)",
    "flet-audio-recorder (==0.2.0.dev504)",
    "pypdfium2 (>=4.30.0,<5.0.0)",
]

[project.urls]
Homepage = "https://github.com/SamYuan1990/i18n-agent-action"
Documentation = "https://samyuan1990.github.io/i18n-agent-action/"
Repository = "https://github.com/SamYuan1990/i18n-agent-action"
Issues = "https://github.com/SamYuan1990/i18n-agent-action/issues"

[project.optional-dependencies]
app = [
    "pyttsx3 >= 2.99"
]

docs = [
    "mkdocs>=1.6.1,<2.0.0",
    "mkdocs-material>=9.6.17,<10.0.0",
    "mkdocs-get-deps>=0.2.0,<0.3.0",
    "mkdocs-git-revision-date-localized-plugin>=1.4.7,<2.0.0",
    "mkdocs-material-extensions>=1.3.1,<2.0.0",
    "mkdocs-static-i18n>=1.3.0,<2.0.0"
]

[tool.poetry.group.app.dependencies]
pyttsx3 = "^2.99"
sounddevice = "^0.5.2"
cryptography = "^45.0.6"
flet-audio = "^0.1.0"

[tool.poetry.group.docs.dependencies]
mkdocs = "^1.6.1"
mkdocs-material = "^9.6.19"
mkdocs-get-deps = "^0.2.0"
mkdocs-git-revision-date-localized-plugin = "^1.4.7"
mkdocs-material-extensions = "^1.3.1"
mkdocs-static-i18n = "^1.3.0"


[tool.poetry.group.dev.dependencies]
pytest = "^8.4.2"
pytest-cov = "^7.0.0"
onnxruntime = "^1.22.1"
sherpa-onnx = "^1.12.13"
soundfile = "^0.13.1"


[tool.poetry.group.mcp.dependencies]
mcp = "^1.14.0"
httpx = "^0.28.1"
uvicorn = "^0.35.0"
anthropic = "^0.67.0"

[tool.flit.sdist]
include = ["AgentUtils/**/*","Business/**/*"]

[tool.flet]
permissions = ["microphone"]

[tool.flet.macos]
entitlement."com.apple.security.files.user-selected.read-write" = true
entitlement."com.apple.security.device.audio-input" = true

[tool.flet.android]
min_sdk_version = 24

[tool.flet.flutter.pubspec.dependency_overrides]
webview_flutter_android = "4.10.1"
record = "6.1.1"